name: Extract Transcript

on:
  push:
    branches: [ "claude/video-transcript-extraction-jlAit" ]
    paths-ignore:
      - "transcripts/**"
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL or ID"
        required: true
        default: "https://youtu.be/gTr3J33kQLA"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: ${{ github.event.inputs.video_url || 'https://youtu.be/gTr3J33kQLA' }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install --upgrade yt-dlp youtube-transcript-api
          npm init -y >/dev/null 2>&1 || true
          npm install bgutils-js jsdom

      - name: Extract via third-party services
        id: thirdparty
        continue-on-error: true
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python scripts/third_party.py "$VIDEO_URL"

      - name: Extract via free proxy pool
        id: proxy
        if: steps.thirdparty.outcome != 'success'
        continue-on-error: true
        run: python scripts/proxy_extract.py "$VIDEO_URL"

      - name: Extract via yt-dlp + cookies
        id: cookies
        if: steps.thirdparty.outcome != 'success' && steps.proxy.outcome != 'success' && env.YT_COOKIES != ''
        continue-on-error: true
        run: |
          printf '%s' "$YT_COOKIES" > cookies.txt
          mkdir -p transcripts
          yt-dlp --cookies cookies.txt --js-runtimes node \
            --skip-download --write-auto-subs --write-subs --sub-langs "en.*" \
            --sub-format "json3/vtt/srv1" --convert-subs srt \
            -o "transcripts/%(id)s.%(ext)s" "$VIDEO_URL"
          rm -f cookies.txt
          python scripts/srt_to_txt.py transcripts || true

      - name: Mint PO token
        id: mint
        continue-on-error: true
        run: |
          node scripts/mint_potoken.mjs > potoken.json
          echo "---- potoken.json ----"
          node -e "const t=require('./potoken.json'); console.log('vd len', t.visitorData.length, 'po len', t.poToken.length)"

      - name: Extract via InnerTube (PO token)
        id: po
        if: steps.thirdparty.outcome != 'success' && steps.proxy.outcome != 'success' && steps.cookies.outcome != 'success'
        continue-on-error: true
        run: node scripts/po_transcript.mjs "$VIDEO_URL"

      - name: Extract via yt-dlp + PO token
        id: ytpo
        if: steps.thirdparty.outcome != 'success' && steps.proxy.outcome != 'success' && steps.cookies.outcome != 'success' && steps.po.outcome != 'success'
        continue-on-error: true
        run: |
          if [ ! -s potoken.json ]; then echo "no token"; exit 1; fi
          PO=$(node -e "process.stdout.write(require('./potoken.json').poToken)")
          VD=$(node -e "process.stdout.write(require('./potoken.json').visitorData)")
          mkdir -p transcripts
          yt-dlp \
            --js-runtimes node \
            --extractor-args "youtube:player_client=web;visitor_data=$VD;po_token=web.player+$PO,web.gvs+$PO,web.subs+$PO" \
            --skip-download --write-auto-subs --write-subs --sub-langs "en.*" \
            --sub-format "json3/vtt/srv1" --convert-subs srt \
            -o "transcripts/%(id)s.%(ext)s" "$VIDEO_URL"
          # convert any srt to txt
          python scripts/srt_to_txt.py transcripts || true

      - name: Extract via yt-dlp / transcript-api (last resort)
        if: steps.thirdparty.outcome != 'success' && steps.proxy.outcome != 'success' && steps.cookies.outcome != 'success' && steps.po.outcome != 'success' && steps.ytpo.outcome != 'success'
        continue-on-error: true
        run: python scripts/extract_transcript.py "$VIDEO_URL"

      - name: Show transcript in log
        if: always()
        run: |
          echo "=================== TRANSCRIPT ==================="
          cat transcripts/*.txt 2>/dev/null | head -200 || echo "(no transcript produced)"
          echo "================================================="

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: transcripts/
          if-no-files-found: ignore

      - name: Commit transcript
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f potoken.json
          git add transcripts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add transcript for ${VIDEO_URL} [skip ci]"
            git push origin HEAD:claude/video-transcript-extraction-jlAit
          fi

      - name: Fail if no transcript
        if: always()
        run: test -n "$(ls -A transcripts/*.txt 2>/dev/null)" || (echo "no transcript" && exit 1)
